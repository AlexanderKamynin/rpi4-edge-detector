[project]
name = "edge-detector"
version = "0.0.1"
requires-python = ">=3.10"
authors = [{ name = "Alexander Kamynin", email = "kamyninsasa@gmail.com" }]
readme = "README.md"

dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "timm==1.0.29",
    "ultralytics==8.4.137",
    "numpy",
    "opencv-python==5.0.0.93",
    "pycocotools==2.0.8",
    "tqdm>=4.67.1",
    "setuptools<81",
    "ipykernel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]